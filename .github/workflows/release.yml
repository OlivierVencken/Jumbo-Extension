name: Release userscript

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-userscript
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check release version
        run: node scripts/check-release.mjs
      - run: npm ci
      - run: npm test
      - name: Upload both assets before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Mijn vulcheck $GITHUB_REF_NAME" --generate-notes dist/jumbo-checklist.user.js dist/jumbo-checklist.meta.js
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
